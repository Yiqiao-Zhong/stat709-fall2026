<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Information flows from X to Y to Z. An independent random seed may enter only the last processing step." style="font-family:system-ui,sans-serif;font-size:14px;fill:#18384e"><title>Information flows from X to Y to Z. An independent random seed may enter only the last processing step.</title><text x="25" y="32" font-weight="650">Processing cannot add information</text><rect x="25" y="85" width="85" height="65" rx="7" fill="#e8efef" stroke="#18384e"/><text x="67" y="125" text-anchor="middle" font-size="24">X</text><rect x="160" y="85" width="85" height="65" rx="7" fill="#e8efef" stroke="#18384e"/><text x="202" y="125" text-anchor="middle" font-size="24">Y</text><rect x="295" y="85" width="85" height="65" rx="7" fill="#e8efef" stroke="#18384e"/><text x="337" y="125" text-anchor="middle" font-size="24">Z</text><text x="124" y="122" >→</text><text x="259" y="122" >→</text><text x="320" y="220" text-anchor="middle">Independent seed</text><text x="333" y="184" font-size="24">↑</text></svg>
