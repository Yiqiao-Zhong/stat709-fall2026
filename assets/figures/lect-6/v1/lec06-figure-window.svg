<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 265" role="img" aria-label="First-order window picture for the fourth order statistic of six observations: three points left, one near x, two right." style="font-family:system-ui,sans-serif;font-size:14px;fill:#18384e"><title>First-order window picture for the fourth order statistic of six observations: three points left, one near x, two right.</title><text x="24" y="30" font-weight="650">One point in a small window</text><rect x="216" y="70" width="35" height="80" fill="#aa7318" opacity=".2"/><line x1="25" y1="110" x2="375" y2="110" stroke="#18384e" stroke-width="2"/><circle cx="45" cy="110" r="4" fill="#087e83"/><circle cx="93" cy="110" r="4" fill="#087e83"/><circle cx="160" cy="110" r="4" fill="#087e83"/><circle cx="231" cy="110" r="4" fill="#087e83"/><circle cx="303" cy="110" r="4" fill="#087e83"/><circle cx="349" cy="110" r="4" fill="#087e83"/><text x="90" y="175" >3 points left</text><text x="211" y="200" >x to x + ε</text><text x="288" y="175" >2 right</text><text x="30" y="237" >n = 6, i = 4 · first-order picture</text></svg>
