<title>Separate density from communities</title><desc>The constant matrix plus the signed community matrix gives the expected adjacency matrix plus p-star times identity, here p-star=0.4 and q-star=0.2. Subtract p-star times identity to restore the zero diagonal in the lecture’s model.</desc>
