<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-label="A latent mixture with two equally weighted branches" style="font:16px system-ui,sans-serif;fill:#18384e"><title>A latent mixture with two equally weighted branches</title><rect width="600" height="350" fill="#fffdf8"/><rect x="215" y="15" width="170" height="45" rx="7" fill="#e5eff0" stroke="#087e83"/><text x="300" y="42.5" text-anchor="middle">Fair selector Y</text><path d="M245 60 L145 105" stroke="#b77b18" stroke-width="2.5" fill="none"/><circle cx="145" cy="105" r="3" fill="#b77b18"/><path d="M355 60 L455 105" stroke="#b77b18" stroke-width="2.5" fill="none"/><circle cx="455" cy="105" r="3" fill="#b77b18"/><text x="126" y="88" >Y = 0</text><text x="434" y="88" >Y = 1</text><rect x="40" y="110" width="220" height="55" rx="7" fill="#e5eff0" stroke="#087e83"/><text x="150" y="142.5" text-anchor="middle">Discrete law μ₀</text><rect x="340" y="110" width="220" height="55" rx="7" fill="#e5eff0" stroke="#087e83"/><text x="450" y="142.5" text-anchor="middle">Density h</text><text x="92" y="198" >Weight ½</text><text x="395" y="198" >Weight ½</text><path d="M150 210 L245 252" stroke="#b77b18" stroke-width="2.5" fill="none"/><circle cx="245" cy="252" r="3" fill="#b77b18"/><path d="M450 210 L355 252" stroke="#b77b18" stroke-width="2.5" fill="none"/><circle cx="355" cy="252" r="3" fill="#b77b18"/><rect x="60" y="258" width="480" height="65" rx="7" fill="#e5eff0" stroke="#087e83"/><text x="300" y="295.5" text-anchor="middle">P(X ∈ B) = ½ μ₀(B) + ½ ∫_B h(x) dx</text></svg>