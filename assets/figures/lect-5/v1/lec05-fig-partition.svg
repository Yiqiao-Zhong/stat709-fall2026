<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-label="Four equal-probability outcomes and their group averages" style="font:16px system-ui,sans-serif;fill:#18384e"><title>Four equal-probability outcomes and their group averages</title><rect width="600" height="350" fill="#fffdf8"/><text x="145" y="30" text-anchor="middle">First pair</text><text x="435" y="30" text-anchor="middle">Last pair</text><rect x="20" y="53" width="125" height="65" rx="7" fill="#e5eff0" stroke="#087e83"/><text x="82.5" y="90.5" text-anchor="middle">0</text><rect x="165" y="53" width="125" height="65" rx="7" fill="#e5eff0" stroke="#087e83"/><text x="227.5" y="90.5" text-anchor="middle">2</text><rect x="310" y="53" width="125" height="65" rx="7" fill="#e5eff0" stroke="#087e83"/><text x="372.5" y="90.5" text-anchor="middle">4</text><rect x="455" y="53" width="125" height="65" rx="7" fill="#e5eff0" stroke="#087e83"/><text x="517.5" y="90.5" text-anchor="middle">8</text><text x="300" y="145" text-anchor="middle">Each outcome has probability ¼</text><path d="M82 157 L82 196" stroke="#b77b18" stroke-width="2.5" fill="none"/><circle cx="82" cy="196" r="3" fill="#b77b18"/><rect x="20" y="206" width="125" height="65" rx="7" fill="#e5eff0" stroke="#087e83"/><text x="82.5" y="243.5" text-anchor="middle">1</text><path d="M227 157 L227 196" stroke="#b77b18" stroke-width="2.5" fill="none"/><circle cx="227" cy="196" r="3" fill="#b77b18"/><rect x="165" y="206" width="125" height="65" rx="7" fill="#e5eff0" stroke="#087e83"/><text x="227.5" y="243.5" text-anchor="middle">1</text><path d="M372 157 L372 196" stroke="#b77b18" stroke-width="2.5" fill="none"/><circle cx="372" cy="196" r="3" fill="#b77b18"/><rect x="310" y="206" width="125" height="65" rx="7" fill="#e5eff0" stroke="#087e83"/><text x="372.5" y="243.5" text-anchor="middle">6</text><path d="M517 157 L517 196" stroke="#b77b18" stroke-width="2.5" fill="none"/><circle cx="517" cy="196" r="3" fill="#b77b18"/><rect x="455" y="206" width="125" height="65" rx="7" fill="#e5eff0" stroke="#087e83"/><text x="517.5" y="243.5" text-anchor="middle">6</text><text x="300" y="313" text-anchor="middle">E[E(X | Y)] = ½ × 1 + ½ × 6 = 3.5 = E[X]</text></svg>