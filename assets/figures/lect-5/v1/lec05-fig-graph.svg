<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Gaussian conditional independence in a three-node chain" style="font:16px system-ui,sans-serif;fill:#18384e"><title>Gaussian conditional independence in a three-node chain</title><rect width="600" height="300" fill="#fffdf8"/><path d="M140 90 L270 90" stroke="#b77b18" stroke-width="2.5" fill="none"/><circle cx="270" cy="90" r="3" fill="#b77b18"/><path d="M330 90 L460 90" stroke="#b77b18" stroke-width="2.5" fill="none"/><circle cx="460" cy="90" r="3" fill="#b77b18"/><circle cx="110" cy="90" r="34" fill="#e5eff0" stroke="#087e83" stroke-width="2"/><text x="110" y="96" text-anchor="middle">X₁</text><circle cx="300" cy="90" r="34" fill="#e5eff0" stroke="#087e83" stroke-width="2"/><text x="300" y="96" text-anchor="middle">X₂</text><circle cx="490" cy="90" r="34" fill="#e5eff0" stroke="#087e83" stroke-width="2"/><text x="490" y="96" text-anchor="middle">X₃</text><text x="300" y="175" text-anchor="middle" font-weight="700">Precision entry Θ₁₃ = 0</text><text x="300" y="218" text-anchor="middle">X₁ and X₃ are independent given X₂</text><text x="300" y="264" text-anchor="middle">Their marginal covariance is Σ₁₃ = 1</text></svg>