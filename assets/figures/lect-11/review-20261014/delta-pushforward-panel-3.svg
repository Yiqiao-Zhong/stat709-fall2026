<title>The tangent transports uncertainty</title><desc>An approximately Normal input near c=1 with standard deviation 0.12 is mapped by x squared. The tangent predicts output standard deviation 0.24. The output density is a first-order approximation, not the exact squared-Normal law.</desc>
