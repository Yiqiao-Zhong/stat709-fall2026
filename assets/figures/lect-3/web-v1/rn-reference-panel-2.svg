<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="294.437447 0 265.58399999999995 242.78025" width="265.58399999999995" height="218.78025"><title>Circle law and the choice of reference — panel 2</title><desc>A uniform-angle law has all its probability on the unit circle, a set of zero plane area, so it has no density against area. Against arc-length measure on the circle its density is 1/(2 pi); a quarter-circle arc has probability one-quarter.</desc><defs><style type="text/css">*{stroke-linecap:butt;stroke-linejoin:round;}</style>
