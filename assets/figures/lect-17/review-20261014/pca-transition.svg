<title>PCA overlap across the threshold</title><desc>For aspect ratio gamma=1/2, limiting squared eigenvector overlap is zero through theta=sqrt(gamma), then rises according to the lecture’s formula. Positive overlap is not consistency: the limit stays below one at finite spike strength.</desc>
