<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" role="img" aria-label="Positions 1 and 4 share index i, 2 and 6 share j, and 3 and 5 share k." style="font-family:system-ui,sans-serif;font-size:18px;fill:#18384e"><title>Positions 1 and 4 share index i, 2 and 6 share j, and 3 and 5 share k.</title><text x="32" y="30" font-weight="650">Six positions: one leading pairing</text><circle cx="65" cy="120" r="20" fill="#e0efeb" stroke="#087e83"/><text x="65" y="126" text-anchor="middle">1</text><circle cx="157" cy="120" r="20" fill="#e0efeb" stroke="#087e83"/><text x="157" y="126" text-anchor="middle">2</text><circle cx="249" cy="120" r="20" fill="#e0efeb" stroke="#087e83"/><text x="249" y="126" text-anchor="middle">3</text><circle cx="341" cy="120" r="20" fill="#e0efeb" stroke="#087e83"/><text x="341" y="126" text-anchor="middle">4</text><circle cx="433" cy="120" r="20" fill="#e0efeb" stroke="#087e83"/><text x="433" y="126" text-anchor="middle">5</text><circle cx="525" cy="120" r="20" fill="#e0efeb" stroke="#087e83"/><text x="525" y="126" text-anchor="middle">6</text><path d="M65 145 V200 H341 V145" stroke="#087e83" stroke-width="3" fill="none"/><path d="M157 145 V260 H525 V145" stroke="#a16b12" stroke-width="3" fill="none"/><path d="M249 145 V230 H433 V145" stroke="#85456d" stroke-width="3" fill="none"/><text x="32" y="305" >Index labels: i, j, k, i, k, j</text><text x="32" y="339" >Three distinct indices; each appears twice.</text></svg>
