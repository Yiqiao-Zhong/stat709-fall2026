<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" role="img" aria-label="The proof starts with six Gaussian Y terms, then three X and three Y terms, then six X terms. The displayed six slots illustrate the general n-step argument." style="font-family:system-ui,sans-serif;font-size:18px;fill:#18384e"><title>The proof starts with six Gaussian Y terms, then three X and three Y terms, then six X terms. The displayed six slots illustrate the general n-step argument.</title><text x="32" y="30" font-weight="650">Replace one observation at a time</text><text x="30" y="106" >i = 0</text><rect x="100" y="82" width="66" height="42" rx="6" fill="#f2e5ca" stroke="#a16b12"/><text x="133" y="109" text-anchor="middle">Y1</text><rect x="177" y="82" width="66" height="42" rx="6" fill="#f2e5ca" stroke="#a16b12"/><text x="210" y="109" text-anchor="middle">Y2</text><rect x="254" y="82" width="66" height="42" rx="6" fill="#f2e5ca" stroke="#a16b12"/><text x="287" y="109" text-anchor="middle">Y3</text><rect x="331" y="82" width="66" height="42" rx="6" fill="#f2e5ca" stroke="#a16b12"/><text x="364" y="109" text-anchor="middle">Y4</text><rect x="408" y="82" width="66" height="42" rx="6" fill="#f2e5ca" stroke="#a16b12"/><text x="441" y="109" text-anchor="middle">Y5</text><rect x="485" y="82" width="66" height="42" rx="6" fill="#f2e5ca" stroke="#a16b12"/><text x="518" y="109" text-anchor="middle">Y6</text><text x="30" y="191" >i = 3</text><rect x="100" y="167" width="66" height="42" rx="6" fill="#e0efeb" stroke="#087e83"/><text x="133" y="194" text-anchor="middle">X1</text><rect x="177" y="167" width="66" height="42" rx="6" fill="#e0efeb" stroke="#087e83"/><text x="210" y="194" text-anchor="middle">X2</text><rect x="254" y="167" width="66" height="42" rx="6" fill="#e0efeb" stroke="#087e83"/><text x="287" y="194" text-anchor="middle">X3</text><rect x="331" y="167" width="66" height="42" rx="6" fill="#f2e5ca" stroke="#a16b12"/><text x="364" y="194" text-anchor="middle">Y4</text><rect x="408" y="167" width="66" height="42" rx="6" fill="#f2e5ca" stroke="#a16b12"/><text x="441" y="194" text-anchor="middle">Y5</text><rect x="485" y="167" width="66" height="42" rx="6" fill="#f2e5ca" stroke="#a16b12"/><text x="518" y="194" text-anchor="middle">Y6</text><text x="30" y="276" >i = 6</text><rect x="100" y="252" width="66" height="42" rx="6" fill="#e0efeb" stroke="#087e83"/><text x="133" y="279" text-anchor="middle">X1</text><rect x="177" y="252" width="66" height="42" rx="6" fill="#e0efeb" stroke="#087e83"/><text x="210" y="279" text-anchor="middle">X2</text><rect x="254" y="252" width="66" height="42" rx="6" fill="#e0efeb" stroke="#087e83"/><text x="287" y="279" text-anchor="middle">X3</text><rect x="331" y="252" width="66" height="42" rx="6" fill="#e0efeb" stroke="#087e83"/><text x="364" y="279" text-anchor="middle">X4</text><rect x="408" y="252" width="66" height="42" rx="6" fill="#e0efeb" stroke="#087e83"/><text x="441" y="279" text-anchor="middle">X5</text><rect x="485" y="252" width="66" height="42" rx="6" fill="#e0efeb" stroke="#087e83"/><text x="518" y="279" text-anchor="middle">X6</text><text x="30" y="345" >Both inputs: mean 0, variance σ²; compare smooth tests.</text></svg>
