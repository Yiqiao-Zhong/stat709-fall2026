<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" role="img" aria-label="Four equal-weight observations before and after a row shuffle. Frequencies stay the same; paired values change." style="font-family:system-ui,sans-serif;font-size:18px;fill:#18384e"><title>Four equal-weight observations before and after a row shuffle. Frequencies stay the same; paired values change.</title><text x="32" y="30" font-weight="650">Same pmf under shuffling</text><text x="40" y="100" >Row 1</text><text x="220" y="100" text-anchor="middle">-2</text><text x="420" y="100" text-anchor="middle">1</text><text x="40" y="148" >Row 2</text><text x="220" y="148" text-anchor="middle">-1</text><text x="420" y="148" text-anchor="middle">-2</text><text x="40" y="196" >Row 3</text><text x="220" y="196" text-anchor="middle">1</text><text x="420" y="196" text-anchor="middle">2</text><text x="40" y="244" >Row 4</text><text x="220" y="244" text-anchor="middle">2</text><text x="420" y="244" text-anchor="middle">-1</text><text x="220" y="62" text-anchor="middle">Before</text><text x="420" y="62" text-anchor="middle">After shuffling</text><text x="40" y="326" >Both columns: each of −2, −1, 1, 2 appears once.</text></svg>
