<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" role="img" aria-label="Three rows identify the zero linear term, surviving quadratic term and vanishing remainder in the characteristic-function expansion." style="font-family:system-ui,sans-serif;font-size:18px;fill:#18384e"><title>Three rows identify the zero linear term, surviving quadratic term and vanishing remainder in the characteristic-function expansion.</title><text x="32" y="30" font-weight="650">The quadratic term survives</text><rect x="30" y="60" width="540" height="78" rx="7" fill="#eef3ef" stroke="#bdcfcf"/><text x="45" y="85" font-weight="650">Linear term</text><text x="315" y="85" >it E[X] / √n</text><text x="45" y="117" >Centering makes it zero.</text><rect x="30" y="154" width="540" height="78" rx="7" fill="#eef3ef" stroke="#bdcfcf"/><text x="45" y="179" font-weight="650">Quadratic term</text><text x="315" y="179" >−t² / (2n)</text><text x="45" y="211" >n contributions remain at order one.</text><rect x="30" y="248" width="540" height="78" rx="7" fill="#eef3ef" stroke="#bdcfcf"/><text x="45" y="273" font-weight="650">Remainder</text><text x="315" y="273" >o(1/n)</text><text x="45" y="305" >n contributions tend to zero.</text></svg>
