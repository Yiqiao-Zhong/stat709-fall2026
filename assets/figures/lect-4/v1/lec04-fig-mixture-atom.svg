<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" role="img" aria-labelledby="title desc"><title id="title">Atomic half</title><desc id="desc">A point mass of one half at zero; its height encodes probability mass.</desc><rect width="380" height="330" fill="#fffdf8"/><g font-family="Arial, Helvetica, sans-serif"><text x="190" y="25" text-anchor="middle" font-size="19" fill="#173753">Atomic half</text><path d="M55 55L55 255" fill="none" stroke="#8c99a2" stroke-width="2"/><path d="M55 255L350 255" fill="none" stroke="#8c99a2" stroke-width="2"/><path d="M102.5 255L102.5 260" fill="none" stroke="#8c99a2" stroke-width="2"/><text x="102.5" y="279" text-anchor="middle" font-size="16" fill="#173753">0</text><path d="M197.5 255L197.5 260" fill="none" stroke="#8c99a2" stroke-width="2"/><text x="197.5" y="279" text-anchor="middle" font-size="16" fill="#173753">1</text><path d="M292.5 255L292.5 260" fill="none" stroke="#8c99a2" stroke-width="2"/><text x="292.5" y="279" text-anchor="middle" font-size="16" fill="#173753">2</text><text x="44" y="260.0" text-anchor="end" font-size="16" fill="#173753">0</text><path d="M50 255.0L55 255.0" fill="none" stroke="#8c99a2" stroke-width="2"/><text x="44" y="167.5" text-anchor="end" font-size="16" fill="#173753">0.5</text><path d="M50 162.5L55 162.5" fill="none" stroke="#8c99a2" stroke-width="2"/><text x="44" y="75.0" text-anchor="end" font-size="16" fill="#173753">1</text><path d="M50 70.0L55 70.0" fill="none" stroke="#8c99a2" stroke-width="2"/><path d="M102.5 255.0L102.5 162.5" fill="none" stroke="#0b626b" stroke-width="2"/><circle cx="102.5" cy="162.5" r="4" fill="#0b626b" stroke="#0b626b" stroke-width="2"/><text x="220" y="90" text-anchor="middle" font-size="18" fill="#173753">Mass at 0: 1/2</text><text x="190" y="309" text-anchor="middle" font-size="18" fill="#173753">A point mass is not a density height.</text></g></svg>
