<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" role="img" aria-labelledby="title desc"><title id="title">Combined CDF</title><desc id="desc">CDF zero below zero, one half plus t over four on zero to two, and one thereafter. The filled point at zero is one half.</desc><rect width="380" height="330" fill="#fffdf8"/><g font-family="Arial, Helvetica, sans-serif"><text x="190" y="25" text-anchor="middle" font-size="19" fill="#173753">Combined CDF</text><path d="M55 55L55 255" fill="none" stroke="#8c99a2" stroke-width="2"/><path d="M55 255L350 255" fill="none" stroke="#8c99a2" stroke-width="2"/><path d="M102.5 255L102.5 260" fill="none" stroke="#8c99a2" stroke-width="2"/><text x="102.5" y="279" text-anchor="middle" font-size="16" fill="#173753">0</text><path d="M197.5 255L197.5 260" fill="none" stroke="#8c99a2" stroke-width="2"/><text x="197.5" y="279" text-anchor="middle" font-size="16" fill="#173753">1</text><path d="M292.5 255L292.5 260" fill="none" stroke="#8c99a2" stroke-width="2"/><text x="292.5" y="279" text-anchor="middle" font-size="16" fill="#173753">2</text><text x="44" y="260.0" text-anchor="end" font-size="16" fill="#173753">0</text><path d="M50 255.0L55 255.0" fill="none" stroke="#8c99a2" stroke-width="2"/><text x="44" y="175.90909090909093" text-anchor="end" font-size="16" fill="#173753">0.5</text><path d="M50 170.90909090909093L55 170.90909090909093" fill="none" stroke="#8c99a2" stroke-width="2"/><text x="44" y="91.81818181818184" text-anchor="end" font-size="16" fill="#173753">1</text><path d="M50 86.81818181818184L55 86.81818181818184" fill="none" stroke="#8c99a2" stroke-width="2"/><path d="M55.0 255.0L102.5 255.0" fill="none" stroke="#0b626b" stroke-width="2"/><path d="M102.5 170.90909090909093L292.5 86.81818181818184" fill="none" stroke="#0b626b" stroke-width="2"/><path d="M292.5 86.81818181818184L340.0 86.81818181818184" fill="none" stroke="#0b626b" stroke-width="2"/><path d="M102.5 255.0L102.5 170.90909090909093" fill="none" stroke="#94651c" stroke-width="2" stroke-dasharray="4 4"/><circle cx="102.5" cy="255.0" r="4" fill="#fffdf8" stroke="#0b626b" stroke-width="2"/><circle cx="102.5" cy="170.90909090909093" r="4" fill="#0b626b" stroke="#0b626b" stroke-width="2"/><text x="185" y="207" text-anchor="middle" font-size="18" fill="#173753">F(0) = 1/2</text><text x="190" y="309" text-anchor="middle" font-size="18" fill="#173753">Jump first; then a continuous rise.</text></g></svg>
